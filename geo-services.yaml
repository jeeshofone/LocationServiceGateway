AWSTemplateFormatVersion: "2010-09-09"
Description: "Amazon Location Service Maps V2 API key for the Location Service Gateway"

Parameters:
  AllowedReferers:
    Type: CommaDelimitedList
    Description: >-
      Referer patterns allowed to use the key, e.g.
      "https://example.com/*,https://www.example.com/*".
      The gateway forwards the browser's Referer header, so these must be your frontend URLs.
  UpdateTimestamp:
    Type: String
    Default: '0'
    Description: Changes on every deploy to force an update.

Resources:
  LocationApiKey:
    Type: 'AWS::Location::APIKey'
    Properties:
      Description: !Sub 'Location Service Gateway Maps V2 key (${AWS::Region}) - ${UpdateTimestamp}'
      KeyName: !Sub 'LocationServiceGatewayKey-${AWS::Region}'
      NoExpiry: true
      ForceUpdate: true
      ForceDelete: true
      Restrictions:
        AllowActions:
          - 'geo-maps:GetStaticMap'
          - 'geo-maps:GetTile'
        AllowReferers: !Ref AllowedReferers
        AllowResources:
          - !Sub 'arn:aws:geo-maps:${AWS::Region}::provider/default'

Outputs:
  LocationApiKeyName:
    Description: 'Name of the Location Service API key'
    Value: !Ref LocationApiKey
  LocationApiKeyArn:
    Description: 'ARN of the Location Service API key'
    Value: !GetAtt LocationApiKey.KeyArn
