AWSTemplateFormatVersion: "2010-09-09"
Transform: 'AWS::Serverless-2016-10-31'
Description: "Regional API Gateway proxy in front of Amazon Location Service Maps V2"

Parameters:
  ApiKeyValue:
    Type: String
    NoEcho: true
    Description: The Location Service API key value (from geo-services.yaml).
  DomainName:
    Type: String
    Description: The custom domain the gateway is served from, e.g. geo.example.com.
  HostedZoneId:
    Type: String
    Description: The Route 53 hosted zone ID for DomainName.
  CORSOrigin:
    Type: String
    Description: >-
      The single browser origin allowed by CORS, including scheme, e.g. https://example.com.
      Use * only for testing.
  UpdateTimestamp:
    Type: String
    Default: '0'
    Description: Changes on every deploy to force an update.
  HideApiKey:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      When true, a Lambda serves the style descriptor and rewrites its tile, sprite and glyph
      URLs to this gateway with the key removed, so the key never reaches the browser.
      Every tile then goes through API Gateway, which adds API Gateway request charges.

Conditions:
  HideKey: !Equals [!Ref HideApiKey, 'true']
Mappings:
  # Regions where Amazon Location Service Maps V2 is available. Check
  # https://docs.aws.amazon.com/location/latest/developerguide/location-regions.html
  RegionMap:
    us-east-1:
      LocationServiceEndpoint: maps.geo.us-east-1.amazonaws.com
    us-east-2:
      LocationServiceEndpoint: maps.geo.us-east-2.amazonaws.com
    us-west-2:
      LocationServiceEndpoint: maps.geo.us-west-2.amazonaws.com
    ap-south-1:
      LocationServiceEndpoint: maps.geo.ap-south-1.amazonaws.com
    ap-southeast-1:
      LocationServiceEndpoint: maps.geo.ap-southeast-1.amazonaws.com
    ap-southeast-2:
      LocationServiceEndpoint: maps.geo.ap-southeast-2.amazonaws.com
    ap-southeast-5:
      LocationServiceEndpoint: maps.geo.ap-southeast-5.amazonaws.com
    ap-northeast-1:
      LocationServiceEndpoint: maps.geo.ap-northeast-1.amazonaws.com
    ca-central-1:
      LocationServiceEndpoint: maps.geo.ca-central-1.amazonaws.com
    eu-central-1:
      LocationServiceEndpoint: maps.geo.eu-central-1.amazonaws.com
    eu-west-1:
      LocationServiceEndpoint: maps.geo.eu-west-1.amazonaws.com
    eu-west-2:
      LocationServiceEndpoint: maps.geo.eu-west-2.amazonaws.com
    eu-south-2:
      LocationServiceEndpoint: maps.geo.eu-south-2.amazonaws.com
    eu-north-1:
      LocationServiceEndpoint: maps.geo.eu-north-1.amazonaws.com
    sa-east-1:
      LocationServiceEndpoint: maps.geo.sa-east-1.amazonaws.com

Resources:
  Certificate:
    Type: "AWS::CertificateManager::Certificate"
    Properties:
      DomainName: !Ref DomainName
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      ValidationMethod: "DNS"

  GeoApiGateway:
    Type: "AWS::Serverless::Api"
    Properties:
      Description: !Sub "Location Service Gateway (${AWS::Region}) - ${UpdateTimestamp}"
      StageName: "Prod"
      EndpointConfiguration: REGIONAL
      BinaryMediaTypes: !If [HideKey, ['*~1*'], !Ref AWS::NoValue]
      Domain:
        DomainName: !Ref DomainName
        CertificateArn: !Ref Certificate
      DefinitionBody:
        swagger: '2.0'
        info:
          title: !Ref "AWS::StackName"
        paths:
          '/v2/styles/{proxy+}': !If
            - HideKey
            - get:
                produces:
                  - "application/json"
                parameters:
                  - name: proxy
                    in: path
                    required: true
                    type: string
                responses: {}
                x-amazon-apigateway-integration:
                  type: 'aws_proxy'
                  httpMethod: 'POST'
                  uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${StyleRewriteFunction.Arn}/invocations'
            - !Ref AWS::NoValue
          '/{proxy+}':
            get:
              produces:
                - "application/json"
              parameters:
                - name: proxy
                  in: path
                  required: true
                  type: string
              responses:
                "200":
                  description: "200 response"
                  headers:
                    Access-Control-Allow-Origin:
                      type: 'string'
                    Access-Control-Allow-Headers:
                      type: 'string'
                    Access-Control-Allow-Methods:
                      type: 'string'
              x-amazon-apigateway-integration:
                httpMethod: 'GET'
                type: 'http_proxy'
                uri:
                  Fn::Sub:
                    - 'https://${LocationServiceEndpoint}/{proxy}?key=${ApiKey}'
                    - LocationServiceEndpoint: !FindInMap [RegionMap, !Ref "AWS::Region", LocationServiceEndpoint]
                      ApiKey: !Ref ApiKeyValue
                requestParameters:
                  integration.request.path.proxy: 'method.request.path.proxy'
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: !Sub "'${CORSOrigin}'"
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
                      method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
            options:
              summary: "CORS support for preflight requests"
              consumes:
                - "application/json"
              produces:
                - "application/json"
              responses:
                "200":
                  description: "200 response"
                  headers:
                    Access-Control-Allow-Origin:
                      type: "string"
                    Access-Control-Allow-Methods:
                      type: "string"
                    Access-Control-Allow-Headers:
                      type: "string"
              x-amazon-apigateway-integration:
                type: "mock"
                requestTemplates:
                  application/json: "{ \"statusCode\": 200 }"
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: !Sub "'${CORSOrigin}'"
                      method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
                responseTemplates:
                  application/json: "{}"

  # Optional (HideApiKey=true): serves style descriptors with the key stripped out.
  StyleRewriteFunction:
    Type: AWS::Serverless::Function
    Condition: HideKey
    Properties:
      Description: Rewrites Amazon Location style descriptors to point at this gateway without the API key
      Runtime: python3.13
      Handler: index.handler
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          API_KEY: !Ref ApiKeyValue
          UPSTREAM: !FindInMap [RegionMap, !Ref "AWS::Region", LocationServiceEndpoint]
          GATEWAY_DOMAIN: !Ref DomainName
          CORS_ORIGIN: !Ref CORSOrigin
      InlineCode: |
        import base64, os, re, urllib.error, urllib.parse, urllib.request

        UPSTREAM = os.environ["UPSTREAM"]
        GATEWAY = os.environ["GATEWAY_DOMAIN"]

        def strip_key(text):
            text = re.sub(r'\?key=[^&"\s]*&', '?', text)
            return re.sub(r'[?&]key=[^&"\s]*', '', text)

        def handler(event, context):
            path = urllib.parse.quote((event.get("pathParameters") or {}).get("proxy", ""), safe="/")
            query = dict(event.get("queryStringParameters") or {})
            query.pop("key", None)
            query["key"] = os.environ["API_KEY"]
            url = f"https://{UPSTREAM}/v2/styles/{path}?{urllib.parse.urlencode(query)}"
            headers = {k.lower(): v for k, v in (event.get("headers") or {}).items()}
            upstream_headers = {"Referer": headers["referer"]} if "referer" in headers else {}
            try:
                with urllib.request.urlopen(urllib.request.Request(url, headers=upstream_headers), timeout=8) as resp:
                    status, raw = resp.status, resp.read()
                    content_type = resp.headers.get("Content-Type", "application/json")
                    cache = resp.headers.get("Cache-Control")
            except urllib.error.HTTPError as err:
                status, raw = err.code, err.read()
                content_type, cache = "application/json", None
            out = {"Content-Type": content_type, "Access-Control-Allow-Origin": os.environ["CORS_ORIGIN"]}
            if cache:
                out["Cache-Control"] = cache
            if "json" not in content_type and not content_type.startswith("text/"):
                # Sprite images and other binary files under /v2/styles pass through unchanged.
                return {"statusCode": status, "headers": out, "isBase64Encoded": True,
                        "body": base64.b64encode(raw).decode("ascii")}
            body = raw.decode("utf-8", "replace")
            if status == 200:
                body = body.replace(f"https://{UPSTREAM}", f"https://{GATEWAY}")
            return {"statusCode": status, "headers": out, "body": strip_key(body)}

  StyleRewritePermission:
    Type: AWS::Lambda::Permission
    Condition: HideKey
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StyleRewriteFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${GeoApiGateway}/*/GET/v2/styles/*'
Outputs:
  ApiEndpoint:
    Description: "Gateway base URL. Style descriptor: <ApiEndpoint>/v2/styles/Standard/descriptor"
    Value: !Sub "https://${DomainName}"
