AWSTemplateFormatVersion: "2010-09-09"
Transform: 'AWS::Serverless-2016-10-31'
Description: "Regional API Gateway proxy in front of Amazon Location Service Maps V2"

Parameters:
  ApiKeyValue:
    Type: String
    NoEcho: true
    Description: The Location Service API key value (from geo-services.yaml).
  DomainName:
    Type: String
    Description: The custom domain the gateway is served from, e.g. geo.example.com.
  HostedZoneId:
    Type: String
    Description: The Route 53 hosted zone ID for DomainName.
  CORSOrigin:
    Type: String
    Description: >-
      The single browser origin allowed by CORS, including scheme, e.g. https://example.com.
      Use * only for testing.
  UpdateTimestamp:
    Type: String
    Default: '0'
    Description: Changes on every deploy to force an update.

Mappings:
  # Regions where Amazon Location Service Maps V2 is available. Check
  # https://docs.aws.amazon.com/location/latest/developerguide/location-regions.html
  RegionMap:
    us-east-1:
      LocationServiceEndpoint: maps.geo.us-east-1.amazonaws.com
    us-east-2:
      LocationServiceEndpoint: maps.geo.us-east-2.amazonaws.com
    us-west-2:
      LocationServiceEndpoint: maps.geo.us-west-2.amazonaws.com
    ap-south-1:
      LocationServiceEndpoint: maps.geo.ap-south-1.amazonaws.com
    ap-southeast-1:
      LocationServiceEndpoint: maps.geo.ap-southeast-1.amazonaws.com
    ap-southeast-2:
      LocationServiceEndpoint: maps.geo.ap-southeast-2.amazonaws.com
    ap-southeast-5:
      LocationServiceEndpoint: maps.geo.ap-southeast-5.amazonaws.com
    ap-northeast-1:
      LocationServiceEndpoint: maps.geo.ap-northeast-1.amazonaws.com
    ca-central-1:
      LocationServiceEndpoint: maps.geo.ca-central-1.amazonaws.com
    eu-central-1:
      LocationServiceEndpoint: maps.geo.eu-central-1.amazonaws.com
    eu-west-1:
      LocationServiceEndpoint: maps.geo.eu-west-1.amazonaws.com
    eu-west-2:
      LocationServiceEndpoint: maps.geo.eu-west-2.amazonaws.com
    eu-south-2:
      LocationServiceEndpoint: maps.geo.eu-south-2.amazonaws.com
    eu-north-1:
      LocationServiceEndpoint: maps.geo.eu-north-1.amazonaws.com
    sa-east-1:
      LocationServiceEndpoint: maps.geo.sa-east-1.amazonaws.com

Resources:
  Certificate:
    Type: "AWS::CertificateManager::Certificate"
    Properties:
      DomainName: !Ref DomainName
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      ValidationMethod: "DNS"

  GeoApiGateway:
    Type: "AWS::Serverless::Api"
    Properties:
      Description: !Sub "Location Service Gateway (${AWS::Region}) - ${UpdateTimestamp}"
      StageName: "Prod"
      EndpointConfiguration: REGIONAL
      Domain:
        DomainName: !Ref DomainName
        CertificateArn: !Ref Certificate
      DefinitionBody:
        swagger: '2.0'
        info:
          title: !Ref "AWS::StackName"
        paths:
          '/{proxy+}':
            get:
              produces:
                - "application/json"
              parameters:
                - name: proxy
                  in: path
                  required: true
                  type: string
              responses:
                "200":
                  description: "200 response"
                  headers:
                    Access-Control-Allow-Origin:
                      type: 'string'
                    Access-Control-Allow-Headers:
                      type: 'string'
                    Access-Control-Allow-Methods:
                      type: 'string'
              x-amazon-apigateway-integration:
                httpMethod: 'GET'
                type: 'http_proxy'
                uri:
                  Fn::Sub:
                    - 'https://${LocationServiceEndpoint}/{proxy}?key=${ApiKey}'
                    - LocationServiceEndpoint: !FindInMap [RegionMap, !Ref "AWS::Region", LocationServiceEndpoint]
                      ApiKey: !Ref ApiKeyValue
                requestParameters:
                  integration.request.path.proxy: 'method.request.path.proxy'
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: !Sub "'${CORSOrigin}'"
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
                      method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
            options:
              summary: "CORS support for preflight requests"
              consumes:
                - "application/json"
              produces:
                - "application/json"
              responses:
                "200":
                  description: "200 response"
                  headers:
                    Access-Control-Allow-Origin:
                      type: "string"
                    Access-Control-Allow-Methods:
                      type: "string"
                    Access-Control-Allow-Headers:
                      type: "string"
              x-amazon-apigateway-integration:
                type: "mock"
                requestTemplates:
                  application/json: "{ \"statusCode\": 200 }"
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: !Sub "'${CORSOrigin}'"
                      method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
                responseTemplates:
                  application/json: "{}"

Outputs:
  ApiEndpoint:
    Description: "Gateway base URL. Style descriptor: <ApiEndpoint>/v2/styles/Standard/descriptor"
    Value: !Sub "https://${DomainName}"
